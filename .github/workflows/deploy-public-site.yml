name: Deploy public portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare public site
        run: |
          mkdir public-site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='private-admin/' \
            --exclude='scripts/' \
            --exclude='dist-admin/' \
            --exclude='test-newsletter.html' \
            --exclude='signature.html' \
            --exclude='*.docx' \
            ./ public-site/
          touch public-site/.nojekyll

      - name: Upload public site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy public site
        id: deployment
        uses: actions/deploy-pages@v4
